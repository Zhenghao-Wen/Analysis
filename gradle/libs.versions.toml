[versions]
# AGP 受 Gradle 版本上限约束：实测各版本 VersionCheckPlugin 内嵌的 GRADLE_MIN_VERSION
#   9.2.x -> 9.4.1 | 9.3.x -> 9.5.0 | 9.4.x -> 9.6.0
# 本仓库 Gradle wrapper 固定 9.4.1（不升），因此 AGP 最高只能用 9.2.x，取最新的 9.2.1。
agp = "9.2.1"
kotlin = "2.3.0"
androidxCore = "1.18.0"
androidCompileSdk = "37"
androidMinSdk = "24"
androidTargetSdk = "36"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
composeMultiplatform = "1.12.2"
# material3 的版本序列与主 Compose 不同：它只有 alpha（无稳定版），需与 1.12.x 主线上同代。
# 1.12.0-alpha03 声明要求 compose.ui 1.12.0-beta01，低于本仓库的 1.12.2，因此搭配自洽。
# 不可选 1.13.0-alpha02（它要求 compose.ui 1.13.0-alpha02）。
composeMaterial3 = "1.12.0-alpha03"
# com.android.tools:* 与 AGP 同套编号（AGP 9.x -> 32.x），须随 AGP 同步，避免错配。
androidTools = "32.2.1"
androidDesugarJdkLibs = "2.1.5"
koinBom = "4.2.2"
androidxLifecycle = "2.11.0"
# KSP 2.3.4 为当前唯一可用版本：曾试过升到 2.3.12 以配合 Room 3.0.x，
# 但 KSP 2.3.12 下 Room 3.0.0 仍报同一 [MissingType]，故回退。
# 注意 KSP 2.3.12 的 symbol-processing-api 依赖 kotlin-stdlib 2.3.20；
# 本仓库实际生效的 Kotlin 为 2.3.21（由 kmpNativeCoroutines 1.0.3 经 KGP 传递决定）。
ksp = "2.3.4"
protobufPlugin = "0.9.6"
androidxDatastore = "1.2.0"
confettikit = "0.9.0"
ktor = "3.6.0"
coil = "3.6.3"
cloudy = "0.4.0"
nav3Core = "1.1.0"
paging = "3.5.0"
deviceCompat = "2.0"
composeMultiplatformAdaptive = "1.3.0"
multiplatformNav3Ui = "1.1.1"
documentfile = "1.1.0"
ffmpegKitX6kb = "6.1.1"
appfunctions = "1.0.0-alpha07"
# Room 3.0.x 与 KSP2 2.3.4 不兼容（历史结论，保留供参考）：
#   room3 3.0.0 / 3.0.3 时，:core:database:kspAndroidMain 对 5 个实体全部报 [MissingType]，
#   随后 RoomProcessor 报 "not all of its dependencies could be resolved"。
#   已在正确环境（Kotlin 2.3.21 + KSP 2.3.4）下复现，且已排除 sqlite 版本错位 / 坐标缺失 /
#   Room 插件 DSL 变化；KSP1 回退也不可用（KSP 2.3.4 插件内嵌提示
#   "KSP1 is no longer available"，只剩 KspAATask 即 KSP2 实现）。
#
# 最终结论：Room 3.0.x（3.0.0 / 3.0.3）在本仓库不可用，已穷尽可试手段，不要再盲试。
# 关联证据与最小复现建议见 room-ksp-issue-report.md。
# 已试组合（均在 :core:database:kspAndroidMain 失败，错误完全相同）：
#   3.0.3 + sqlite 2.7.1 + KSP 2.3.4 + Kotlin 2.4.20（环境本身错误）
#   3.0.0 + sqlite 2.7.0 + KSP 2.3.4 + Kotlin 2.3.21（环境正确，仍失败）
#   3.0.0 + sqlite 2.7.0 + KSP 2.3.12 + Kotlin 2.3.21（换新 KSP，仍失败）
# 对照组：3.0.0-alpha05 + sqlite 2.6.2 + KSP 2.3.4 + Kotlin 2.3.21 可正常编译。
# 已排除：sqlite 版本错位、坐标缺失、Room 插件 DSL 变化、Kotlin/KSP 版本不匹配、
#   回退 KSP1（KSP 2.3.4 插件内嵌提示 "KSP1 is no longer available"，只剩 KspAATask）。
# Room 3.0.0 稳定版。
#
# 历史：升级到 3.0.x 时 KSP 会对若干实体报 [MissingType]。经 4 轮二分定位，
# 根因是：**凡承载 `@TypeConverters` 的元素都会被 Room 3.0.x 报 MissingType**
# （把注解从 5 个实体移到 @Database 后，错误从 5 条减为 1 条且指向数据库类本身）。
# 与 Kotlin/KSP 版本、expect 默认值、enum 属性、@ColumnInfo、converter 写 class 还是
# object 都无关。
#
# 解决方式：**彻底移除 @TypeConverters**（本仓库已不再包含任何 converter）
#   1) 全部 enum 属性：直接依赖 Room 内置 enum<->String 转换（存 enum 的 name，
#      与原 *Converter 行为一致，数据无需迁移）。已由实验验证可用。
#   2) MediaContainer（sealed interface）：列改为存 extension 字符串，
#      实体上提供 @Ignore 计算属性还原模型；取值与列名均不变。
#   3) NamingConventionInfo（sealed class）：列改为存 JSON 字符串，
#      编解码逻辑移到普通对象 NamingConventionCodec（与旧 converter 完全一致）。
# 因此 schema 与已存数据均无变化，不需要数据库迁移。
#
# 注意：今后**不要**再给实体/DAO/数据库添加 @TypeConverters，否则会重新触发该问题。
room3 = "3.0.0"
sqlite = "2.7.0"
ksoup = "0.2.6"
# 本地二维码生成（替代原先依赖 pan.misakamoe.com 的云端出图服务）
# 1.3.1 要求 compose.ui 1.12.1，本仓库已升至 1.12.2，因此可以解除此前的 1.1.1 锁定。
# 已用 javap 核对 1.3.1 编译产物：QrCodePainter : CachedPainter、rememberQrCodePainter(data, options)、
# QrOptions(colors=)、QrColors(dark=,light=)、QrBrush.Default、QrBrush.solid 均与现有代码一致，无需改代码。
qrose = "1.3.1"
serializationJson = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxIo = "0.9.1"
wire = "6.4.0"
# Testing
junit4 = "4.13.2"
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
truth = "1.4.5"
coroutines = "1.11.0"
turbine = "1.2.1"
okio = "3.18.2"
kmpNativeCoroutines = "1.0.3"
# 注意：kmp-nativecoroutines 的 Gradle 插件会在构建脚本类路径上**钉住 kotlin-gradle-plugin**，
# 从而覆盖本目录里声明的 kotlin 版本。实测各版本要求：
#   1.0.0 -> KGP 2.3.0 | 1.0.1 -> 2.3.10 | 1.0.2 -> 2.3.20 | 1.0.3 -> 2.3.21
#   1.0.4 -> 2.4.0    | 1.0.5 -> 2.4.10  | 1.0.6 -> 2.4.20
# 因此这里必须停在 1.0.3：一旦升到 1.0.4+，实际 Kotlin 会被抬到 2.4.x，
# 而 KSP（2.3.4）是按 Kotlin 2.3.x 构建的，属于不受支持的组合。
# 升级本项前，务必先确认有与之匹配的 KSP 版本可用（截至目前 KSP 尚无 2.4.x）。
buildconfig = "6.0.9"

